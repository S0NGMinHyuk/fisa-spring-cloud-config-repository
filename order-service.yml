spring:
  datasource:
    url: jdbc:mysql://localhost:3306/msa_step02_order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true


# 서비스 디스커버리 설정 (localhost:8081 대신 payment-service로 지정해서 결제 서비스를 탐색한다)
# payment-service의 이름은 설정 파일 속 spring.application.name을 기반으로 한다.
service:
  payment:
    url: http://payment-service

server:
  port: 8080

logging:
  level:
    com.netflix.eureka: TRACE
    com.netflix.discovery: TRACE

# cloud cofig 테스트용 설정 값
custom:
  message: "변경된 메시지 - PROD 환경입니다"
  version: "2.0.1"
